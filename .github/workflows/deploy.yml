name: Deploy to GitHub Pages with Secret Injection

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets into Config
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          WEBAPP_SECRET_KEY: ${{ secrets.WEBAPP_SECRET_KEY }}
        run: |
          echo "Injecting backend API URL and WebApp secret key..."
          # Replace placeholders in config.js
          if [ -n "$BACKEND_API_URL" ]; then
            sed -i "s|__BACKEND_API_URL__|$BACKEND_API_URL|g" config.js
            sed -i "s|__BACKEND_API_URL__|$BACKEND_API_URL|g" dashboard.js
          fi
          if [ -n "$WEBAPP_SECRET_KEY" ]; then
            sed -i "s|__WEBAPP_SECRET_KEY__|$WEBAPP_SECRET_KEY|g" config.js
            sed -i "s|__WEBAPP_SECRET_KEY__|$WEBAPP_SECRET_KEY|g" dashboard.js
          fi
          echo "Secret injection complete."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
